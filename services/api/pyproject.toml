[project]
name = "fte-api"
version = "0.1.0"
description = "HTTP API for the Filing Thesis Engine."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "fte-core",
    "uvicorn[standard]>=0.34",
]

[tool.uv.sources]
fte-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

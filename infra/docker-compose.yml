x-db-env: &db-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fte}:${POSTGRES_PASSWORD:-fte}@db:5432/${POSTGRES_DB:-fte}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fte}
      POSTGRES_DB: ${POSTGRES_DB:-fte}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once on `docker compose up`, applying any new migrations before the API starts.
  migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment: *db-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../apps/web
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

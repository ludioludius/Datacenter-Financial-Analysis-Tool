[project]
name = "filing-thesis-engine"
version = "0.1.0"
description = "Tests AI-infrastructure investment theses against SEC filings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "fte-core",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
fte-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["packages"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"

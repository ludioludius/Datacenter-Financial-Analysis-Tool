[project]
name = "fte-core"
version = "0.1.0"
description = "Shared code: database models, EDGAR client, retrieval and agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
